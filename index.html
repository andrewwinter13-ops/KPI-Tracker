<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lead Tracker</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.js"></script>
<style>
*{box-sizing:border-box;margin:0;padding:0;}
:root{
  --bg:#0a0a0d;--surface:#111116;--surface2:#18181f;--surface3:#1e1e27;
  --border:rgba(255,255,255,0.07);--border2:rgba(255,255,255,0.13);
  --text:#eeeef2;--muted:#77778a;
  --accent:#00e5a0;--accent2:#7b61ff;
  --c-lead:#4a9eff;--c-qual:#7b61ff;--c-yes:#00e5a0;--c-contract:#f7b731;
  --grace:#f7b731;--gigi:#00d2ff;--nina:#ff6b9d;
}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  font-size:13px;min-height:100vh;
  background-image:linear-gradient(rgba(255,255,255,0.013) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.013) 1px,transparent 1px);
  background-size:32px 32px;
}
.dash{max-width:900px;margin:0 auto;padding:24px 16px;}

/* HEADER */
.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;flex-wrap:wrap;gap:10px;}
.header h1{font-size:20px;font-weight:700;letter-spacing:-0.5px;}
.sub{font-size:11px;color:var(--muted);display:flex;align-items:center;gap:6px;margin-top:3px;}
.live-dot{width:7px;height:7px;border-radius:50%;background:var(--accent);display:inline-block;animation:livepulse 2s infinite;flex-shrink:0;}
.live-dot.stale{background:var(--muted);animation:none;}
@keyframes livepulse{0%{box-shadow:0 0 0 0 rgba(0,229,160,0.5);}70%{box-shadow:0 0 0 6px rgba(0,229,160,0);}100%{box-shadow:0 0 0 0 rgba(0,229,160,0);}}
.header-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.tabs{display:flex;gap:3px;background:var(--surface);border-radius:8px;padding:3px;border:0.5px solid var(--border);}
.tab{padding:6px 16px;border-radius:6px;border:none;background:none;color:var(--muted);font-size:12px;cursor:pointer;font-family:inherit;transition:all 0.2s;}
.tab.active{background:var(--surface3);color:var(--text);font-weight:500;}
.week-nav{display:flex;gap:5px;align-items:center;}
.week-nav button{background:none;border:0.5px solid var(--border);color:var(--muted);border-radius:5px;width:26px;height:26px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:all 0.15s;}
.week-nav button:hover{border-color:var(--accent);color:var(--accent);}
.week-nav span{font-size:11px;color:var(--muted);min-width:110px;text-align:center;}
.sync-btn{padding:6px 14px;border-radius:7px;border:0.5px solid var(--border);background:var(--surface2);color:var(--text);font-size:12px;cursor:pointer;font-family:inherit;transition:all 0.15s;font-weight:500;}
.sync-btn:hover{border-color:var(--accent);color:var(--accent);}
.sync-status{font-size:11px;color:var(--muted);}
.sync-status.ok{color:var(--accent);}
.sync-status.err{color:#ff6b6b;}

/* SECTION */
.section{background:var(--surface);border-radius:12px;border:0.5px solid var(--border);margin-bottom:14px;overflow:hidden;}
.section-head{padding:12px 18px;border-bottom:0.5px solid var(--border);display:flex;align-items:center;justify-content:space-between;}
.section-head strong{color:var(--text);font-weight:600;font-size:13px;}

/* LEADERBOARD */
.lb-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;padding:14px;}
.lb-card{background:var(--surface2);border-radius:12px;border:0.5px solid var(--border);padding:16px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;transition:all 0.2s;}
.lb-card.rank-1{border-color:rgba(255,215,0,0.3);}
.lb-card.rank-1::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,gold,transparent);}
.lb-avatar{width:58px;height:58px;border-radius:50%;border:2px solid var(--agent-color);overflow:hidden;flex-shrink:0;}
.lb-avatar img{width:100%;height:100%;object-fit:cover;display:block;}
.lb-info{flex:1;min-width:0;}
.lb-rank{font-size:10px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:0.5px;margin-bottom:2px;}
.lb-rank.crown::before{content:'👑 ';}
.lb-name{font-size:15px;font-weight:700;letter-spacing:-0.3px;margin-bottom:5px;}
.lb-score-row{display:flex;align-items:baseline;gap:6px;}
.lb-score{font-size:30px;font-weight:700;letter-spacing:-1.5px;color:var(--accent2);line-height:1;font-variant-numeric:tabular-nums;}
.lb-score-label{font-size:11px;color:var(--muted);}

/* PIPELINE CARDS */
.pipe-cards{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 14px;}
.pipe-card{background:var(--surface2);border-radius:10px;padding:12px 14px;border:0.5px solid var(--border);border-top:2px solid var(--pipe-color);position:relative;overflow:hidden;}
.pipe-card::after{content:'';position:absolute;bottom:0;right:0;width:50px;height:50px;background:radial-gradient(circle at bottom right,var(--pipe-color),transparent 70%);opacity:0.08;pointer-events:none;}
.pipe-label{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:0.6px;font-weight:500;margin-bottom:5px;}
.pipe-value{font-size:26px;font-weight:700;letter-spacing:-1px;color:var(--pipe-color);font-variant-numeric:tabular-nums;line-height:1;}
.pipe-sub{font-size:10px;color:var(--muted);margin-top:3px;}

/* FUNNEL */
.funnel-wrap{padding:10px 14px 14px;display:flex;flex-direction:column;gap:2px;}
.funnel-row{display:flex;align-items:center;gap:10px;}
.funnel-label{font-size:12px;font-weight:600;width:72px;flex-shrink:0;}
.funnel-bar-wrap{flex:1;background:rgba(255,255,255,0.05);border-radius:5px;height:24px;overflow:hidden;}
.funnel-bar{height:100%;border-radius:5px;width:0%;transition:width 0.9s cubic-bezier(0.16,1,0.3,1);display:flex;align-items:center;padding-left:10px;font-size:11px;font-weight:600;white-space:nowrap;}
.funnel-count{font-size:14px;font-weight:700;width:28px;text-align:right;flex-shrink:0;font-variant-numeric:tabular-nums;}
.funnel-pct{font-size:11px;color:var(--muted);width:34px;text-align:right;flex-shrink:0;}
.conv-row{padding:1px 0 1px 82px;}
.conv-arrow{font-size:10px;color:var(--muted);display:flex;align-items:center;gap:4px;}
.conv-arrow::before{content:'↓';opacity:0.4;}
.conv-rate{font-weight:600;}
.conv-rate.high{color:var(--c-yes);}
.conv-rate.mid{color:var(--c-contract);}
.conv-rate.low{color:#ff6b6b;}

/* AGENT BREAKDOWN */
.agent-row{display:grid;grid-template-columns:140px 1fr 90px;align-items:center;gap:14px;padding:13px 18px;border-bottom:0.5px solid var(--border);transition:background 0.15s;}
.agent-row:last-child{border-bottom:none;}
.agent-row:hover{background:var(--surface2);}
.agent-name{font-size:13px;font-weight:600;display:flex;align-items:center;gap:10px;}
.agent-avatar-sm{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;flex-shrink:0;}
.bar-wrap{background:rgba(255,255,255,0.05);border-radius:5px;height:7px;overflow:hidden;margin-bottom:6px;}
.bar-wrap:last-child{margin-bottom:0;}
.bar-fill{height:100%;border-radius:5px;width:0%;transition:width 0.8s cubic-bezier(0.16,1,0.3,1);position:relative;overflow:hidden;}
.bar-fill::after{content:'';position:absolute;top:0;left:-100%;right:-100%;bottom:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,0.25),transparent);animation:none;}
.bar-fill.pulse::after{animation:shimmer 1.2s ease-out;}
@keyframes shimmer{0%{transform:translateX(-100%);}100%{transform:translateX(100%);}}
.counts-cell{display:flex;flex-direction:column;align-items:flex-end;gap:3px;}
.count-main{font-size:16px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1;}
.count-badges{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end;}
.badge{font-size:10px;border-radius:3px;padding:2px 6px;font-weight:600;}
.badge-qual{background:rgba(123,97,255,0.12);color:var(--c-qual);}
.badge-yes{background:rgba(0,229,160,0.12);color:var(--c-yes);}
.badge-contract{background:rgba(247,183,49,0.12);color:var(--c-contract);}
.sync-row{display:flex;align-items:center;gap:12px;padding:12px 18px;border-top:0.5px solid var(--border);}

/* QUARTERLY CHART */
.chart-controls{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.q-tabs{display:flex;gap:3px;}
.q-tab{padding:4px 11px;border-radius:5px;border:0.5px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.15s;}
.q-tab.active{background:var(--surface3);color:var(--text);border-color:var(--border2);font-weight:500;}
.type-filters{display:flex;gap:3px;}
.type-btn{padding:4px 10px;border-radius:5px;border:0.5px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.15s;}
.type-btn.active{background:var(--surface3);color:var(--text);border-color:var(--border2);}
.agent-filters{display:flex;gap:3px;margin-left:auto;}
.agent-btn{padding:4px 10px;border-radius:5px;border:0.5px solid var(--border);background:none;color:var(--muted);font-size:11px;cursor:pointer;font-family:inherit;transition:all 0.15s;display:flex;align-items:center;gap:5px;opacity:0.45;}
.agent-btn.active{color:var(--text);border-color:var(--border2);opacity:1;}
.agent-btn .abdot{width:7px;height:7px;border-radius:50%;flex-shrink:0;}
.chart-wrap{padding:16px;position:relative;height:220px;}

@media(max-width:600px){
  .lb-grid{grid-template-columns:1fr;}
  .pipe-cards{grid-template-columns:repeat(2,1fr);}
  .agent-row{grid-template-columns:110px 1fr 70px;gap:8px;}
  .chart-controls{gap:6px;}
  .agent-filters{margin-left:0;}
  .type-filters{flex-wrap:wrap;}
}
</style>
</head>
<body>
<div class="dash">

  <!-- HEADER -->
  <div class="header">
    <div>
      <h1>Lead Tracker</h1>
      <div class="sub"><span class="live-dot stale" id="live-dot"></span><span id="dateline">Loading...</span></div>
    </div>
    <div class="header-right">
      <div class="tabs">
        <button class="tab active" onclick="setView('weekly')">Weekly</button>
        <button class="tab" onclick="setView('monthly')">Monthly</button>
      </div>
      <div id="week-nav" class="week-nav">
        <button onclick="shiftWeek(-1)">&#8249;</button>
        <span id="week-label"></span>
        <button onclick="shiftWeek(1)">&#8250;</button>
      </div>
    </div>
  </div>

  <!-- 1. LEADERBOARD -->
  <div class="section">
    <div class="section-head"><strong id="lb-title">Leaderboard — this week</strong></div>
    <div class="lb-grid" id="leaderboard"></div>
  </div>

  <!-- 2. PIPELINE FUNNEL -->
  <div class="section">
    <div class="section-head"><strong id="pipeline-title">Pipeline funnel — this week</strong></div>
    <div class="pipe-cards">
      <div class="pipe-card" style="--pipe-color:var(--c-lead)"><div class="pipe-label">Leads</div><div class="pipe-value" id="p-lead">—</div><div class="pipe-sub">new contacts</div></div>
      <div class="pipe-card" style="--pipe-color:var(--c-qual)"><div class="pipe-label">Qualified</div><div class="pipe-value" id="p-qual">—</div><div class="pipe-sub">vetted</div></div>
      <div class="pipe-card" style="--pipe-color:var(--c-yes)"><div class="pipe-label">Yes</div><div class="pipe-value" id="p-yes">—</div><div class="pipe-sub">interested</div></div>
      <div class="pipe-card" style="--pipe-color:var(--c-contract)"><div class="pipe-label">Contracts</div><div class="pipe-value" id="p-contract">—</div><div class="pipe-sub">signed</div></div>
    </div>
    <div class="funnel-wrap" id="funnel"></div>
  </div>

  <!-- 3. AGENT BREAKDOWN -->
  <div class="section">
    <div class="section-head">
      <strong id="breakdown-title">Agent breakdown — this week</strong>
    </div>
    <div id="leads-bars"></div>
    <div class="sync-row">
      <button class="sync-btn" onclick="fetchSheet()">&#8635; Refresh</button>
      <span class="sync-status" id="sync-status">Connecting...</span>
    </div>
  </div>

  <!-- 4. QUARTERLY CHART -->
  <div class="section">
    <div class="section-head">
      <strong id="chart-title">Quarterly breakdown</strong>
      <div class="chart-controls">
        <div class="q-tabs">
          <button class="q-tab" onclick="setQuarter(1)">Q1</button>
          <button class="q-tab" onclick="setQuarter(2)">Q2</button>
          <button class="q-tab" onclick="setQuarter(3)">Q3</button>
          <button class="q-tab" onclick="setQuarter(4)">Q4</button>
        </div>
        <div class="type-filters">
          <button class="type-btn active" data-type="all" onclick="setTypeFilter('all')">All</button>
          <button class="type-btn" data-type="lead" onclick="setTypeFilter('lead')">Leads</button>
          <button class="type-btn" data-type="qualified" onclick="setTypeFilter('qualified')">Qualified</button>
          <button class="type-btn" data-type="yes" onclick="setTypeFilter('yes')">Yes</button>
          <button class="type-btn" data-type="contract" onclick="setTypeFilter('contract')">Contracts</button>
        </div>
        <div class="agent-filters">
          <button class="agent-btn active" data-agent="grace" onclick="toggleAgent('grace')"><span class="abdot" style="background:#f7b731"></span>Grace</button>
          <button class="agent-btn active" data-agent="gigi" onclick="toggleAgent('gigi')"><span class="abdot" style="background:#00d2ff"></span>Gigi</button>
          <button class="agent-btn active" data-agent="nina" onclick="toggleAgent('nina')"><span class="abdot" style="background:#ff6b9d"></span>Nina</button>
        </div>
      </div>
    </div>
    <div class="chart-wrap">
      <canvas id="mainChart" role="img" aria-label="Quarterly weekly breakdown per agent"></canvas>
    </div>
  </div>

</div>

function getMondayOfWeek(offset){
  const now=new Date(),day=now.getDay(),mon=new Date(now);
  mon.setDate(now.getDate()-(day===0?6:day-1)+(offset*7));
  mon.setHours(0,0,0,0);return mon;
}
function getWeekRange(offset){
  const mon=getMondayOfWeek(offset),sun=new Date(mon);
  sun.setDate(mon.getDate()+6);sun.setHours(23,59,59,999);
  const fmt=d=>d.toLocaleDateString('en-US',{month:'short',day:'numeric'});
  return{start:mon,end:sun,label:fmt(mon)+' – '+fmt(sun)};
}
function filterByWeek(offset){const{start,end}=getWeekRange(offset);return data.filter(e=>e.ts>=start&&e.ts<=end);}
function filterByMonth(date){
  const start=new Date(date.getFullYear(),date.getMonth(),1);
  const end=new Date(date.getFullYear(),date.getMonth()+1,0,23,59,59);
  return data.filter(e=>e.ts>=start&&e.ts<=end);
}
function countByAgent(rows,type){
  const out={};AGENTS.forEach(a=>out[a]=0);
  rows.filter(r=>!type||r.type===type).forEach(r=>{if(out[r.agent]!==undefined)out[r.agent]++;});
  return out;
}
function countByType(rows){
  const out={};TYPES.forEach(t=>out[t]=0);
  rows.forEach(r=>{if(out[r.type]!==undefined)out[r.type]++;});
  return out;
}
function getQuarterWeeks(q,year){
  const startMonth=(q-1)*3;
  const qEnd=new Date(year,startMonth+3,0,23,59,59);
  let cur=new Date(year,startMonth,1);
  const day=cur.getDay();
  if(day!==1)cur.setDate(cur.getDate()+(day===0?1:8-day));
  const weeks=[];
  while(cur<=qEnd){
    const wEnd=new Date(cur);wEnd.setDate(cur.getDate()+6);wEnd.setHours(23,59,59,999);
    weeks.push({start:new Date(cur),end:new Date(wEnd)});
    cur.setDate(cur.getDate()+7);
  }
  weeks.forEach((w,i)=>w.label='Wk '+(i+1));
  return weeks;
}

async function fetchSheet(){
  const statusEl=document.getElementById('sync-status');
  statusEl.textContent='Syncing...';statusEl.className='sync-status';
  const sheetUrl=`https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(SHEET_NAME)}`;
  const proxies=[
    `https://api.allorigins.win/raw?url=${encodeURIComponent(sheetUrl)}`,
    `https://corsproxy.io/?${encodeURIComponent(sheetUrl)}`,
    sheetUrl
  ];
  for(const url of proxies){
    try{
      const res=await fetch(url);if(!res.ok)throw new Error();
      const text=await res.text();if(!text||text.trim().startsWith('<'))throw new Error();
      parseCSV(text);
      const now=new Date();
      statusEl.textContent='Last synced '+now.toLocaleTimeString('en-US',{hour:'numeric',minute:'2-digit'});
      statusEl.className='sync-status ok';
      const dot=document.getElementById('live-dot');dot.classList.remove('stale');
      setTimeout(()=>dot.classList.add('stale'),10000);
      render(true);return;
    }catch(e){}
  }
  statusEl.textContent='Could not connect to sheet';
  statusEl.className='sync-status err';
  render(false);
}

function parseCSV(text){
  const lines=text.trim().split('\n');if(lines.length<2){data=[];return;}
  const headers=lines[0].replace(/"/g,'').split(',').map(h=>h.trim().toLowerCase());
  const tsIdx=headers.indexOf('timestamp'),agentIdx=headers.indexOf('agent'),typeIdx=headers.indexOf('type');
  data=[];
  for(let i=1;i<lines.length;i++){
    const cols=lines[i].split(',').map(c=>c.replace(/^"|"$/g,'').trim());
    if(!cols[tsIdx]||!cols[agentIdx]||!cols[typeIdx])continue;
    const agentKey=AGENT_MAP[cols[agentIdx].toLowerCase()]||null;if(!agentKey)continue;
    const ts=new Date(cols[tsIdx]);if(isNaN(ts.getTime()))continue;
    const rawType=cols[typeIdx].toLowerCase().trim();
    let type='lead';
    if(rawType.includes('contract'))type='contract';
    else if(rawType==='yes'||rawType.includes('yes'))type='yes';
    else if(rawType.includes('qual'))type='qualified';
    data.push({agent:agentKey,type,ts});
  }
}

function renderLeaderboard(rows){
  const scored=AGENTS.map(a=>({
    a,qual:rows.filter(r=>r.agent===a&&r.type==='qualified').length
  })).sort((x,y)=>y.qual-x.qual);
  const ranks=['1st','2nd','3rd'];
  document.getElementById('leaderboard').innerHTML=scored.map((s,i)=>`
    <div class="lb-card ${i===0?'rank-1':''}" style="--agent-color:${COLORS[s.a]}">
      <div class="lb-avatar" style="--agent-color:${COLORS[s.a]}"><img src="${AGENT_PHOTOS[s.a]}" alt="${AGENT_LABELS[s.a]}"></div>
      <div class="lb-info">
        <div class="lb-rank ${i===0?'crown':''}">${ranks[i]}</div>
        <div class="lb-name">${AGENT_LABELS[s.a]}</div>
        <div class="lb-score-row">
          <div class="lb-score">${s.qual}</div>
          <div class="lb-score-label">qualified leads</div>
        </div>
      </div>
    </div>`).join('');
}

function renderPipeline(rows){
  const tc=countByType(rows);
  document.getElementById('p-lead').textContent=tc.lead;
  document.getElementById('p-qual').textContent=tc.qualified;
  document.getElementById('p-yes').textContent=tc.yes;
  document.getElementById('p-contract').textContent=tc.contract;
  const el=document.getElementById('funnel');
  const steps=[
    {type:'lead',label:'Leads',count:tc.lead},
    {type:'qualified',label:'Qualified',count:tc.qualified},
    {type:'yes',label:'Yes',count:tc.yes},
    {type:'contract',label:'Contracts',count:tc.contract}
  ];
  const total=Math.max(tc.lead,1);
  let html='';
  steps.forEach((s,i)=>{
    const barW=Math.max(Math.round((s.count/total)*100),s.count>0?3:0);
    html+=`<div class="funnel-row">
      <div class="funnel-label" style="color:${TYPE_COLORS[s.type]}">${s.label}</div>
      <div class="funnel-bar-wrap"><div class="funnel-bar" data-pct="${barW}" style="background:${TYPE_GRADIENTS[s.type]};width:0%">${s.count>0?s.count:''}</div></div>
      <div class="funnel-count" style="color:${TYPE_COLORS[s.type]}">${s.count}</div>
      <div class="funnel-pct">${s.count>0?Math.round((s.count/total)*100)+'%':'—'}</div>
    </div>`;
    if(i<steps.length-1){
      const from=steps[i].count,to=steps[i+1].count;
      const pct=from>0?Math.round((to/from)*100):0;
      const cls=pct>=50?'high':pct>=25?'mid':'low';
      html+=`<div class="conv-row"><div class="conv-arrow"><span class="conv-rate ${cls}">${pct}% conversion</span></div></div>`;
    }
  });
  el.innerHTML=html;
  requestAnimationFrame(()=>{el.querySelectorAll('.funnel-bar').forEach(b=>{setTimeout(()=>{b.style.width=b.dataset.pct+'%';},80);});});
}

function renderBars(rows,animate){
  const el=document.getElementById('leads-bars');
  const lc=countByAgent(rows,'lead'),qc=countByAgent(rows,'qualified'),yc=countByAgent(rows,'yes'),cc=countByAgent(rows,'contract');
  const maxVal=Math.max(...AGENTS.map(a=>lc[a]+qc[a]+yc[a]+cc[a]),1);
  el.innerHTML=AGENTS.map(a=>{
    const total=lc[a]+qc[a]+yc[a]+cc[a];
    const pct=Math.round((lc[a]/maxVal)*100);
    const key='bar_'+a;
    const isNew=animate&&prevCounts[key]!==undefined&&total>prevCounts[key];
    prevCounts[key]=total;
    return`<div class="agent-row">
      <div class="agent-name">
        <div class="agent-avatar-sm" style="background:color-mix(in srgb,${COLORS[a]} 15%,transparent);color:${COLORS[a]};border:1.5px solid ${COLORS[a]}">${AGENT_INITIALS[a]}</div>
        ${AGENT_LABELS[a]}
      </div>
      <div>
        <div class="bar-wrap"><div class="bar-fill ${isNew?'pulse':''}" data-pct="${pct}" style="background:${GRADIENTS[a]};width:0%"></div></div>
      </div>
      <div class="counts-cell">
        <div class="count-main" style="color:${COLORS[a]}">${lc[a]}</div>
        <div class="count-badges">
          ${qc[a]>0?`<span class="badge badge-qual">${qc[a]}Q</span>`:''}
          ${yc[a]>0?`<span class="badge badge-yes">${yc[a]}Y</span>`:''}
          ${cc[a]>0?`<span class="badge badge-contract">${cc[a]}C</span>`:''}
        </div>
      </div>
    </div>`;
  }).join('');
  requestAnimationFrame(()=>{el.querySelectorAll('.bar-fill').forEach(b=>{setTimeout(()=>{b.style.width=b.dataset.pct+'%';},80);});});
}

function renderChart(){
  const year=new Date().getFullYear();
  const weeks=getQuarterWeeks(activeQuarter,year);
  const datasets=AGENTS.filter(a=>activeAgents.has(a)).map(a=>({
    label:AGENT_LABELS[a],
    data:weeks.map(w=>{
      let rows=data.filter(e=>e.ts>=w.start&&e.ts<=w.end&&e.agent===a);
      if(activeTypeFilter!=='all')rows=rows.filter(r=>r.type===activeTypeFilter);
      return rows.length;
    }),
    borderColor:COLORS[a],backgroundColor:COLORS[a]+'22',
    borderWidth:2,pointBackgroundColor:COLORS[a],pointRadius:4,tension:0.3,fill:false
  }));
  if(chart)chart.destroy();
  chart=new Chart(document.getElementById('mainChart'),{
    type:'line',
    data:{labels:weeks.map(w=>w.label),datasets},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false}},
      scales:{
        x:{ticks:{color:'#77778a',font:{size:11}},grid:{color:'rgba(255,255,255,0.03)'},border:{color:'rgba(255,255,255,0.07)'}},
        y:{ticks:{color:'#77778a',font:{size:11},stepSize:1},grid:{color:'rgba(255,255,255,0.03)'},border:{color:'rgba(255,255,255,0.07)'},beginAtZero:true}
      }
    }
  });
}

function setQuarter(q){
  activeQuarter=q;
  document.querySelectorAll('.q-tab').forEach((b,i)=>b.classList.toggle('active',i+1===q));
  renderChart();
}
function setTypeFilter(t){
  activeTypeFilter=t;
  document.querySelectorAll('.type-btn').forEach(b=>b.classList.toggle('active',b.dataset.type===t));
  renderChart();
}
function toggleAgent(a){
  if(activeAgents.has(a)){if(activeAgents.size>1)activeAgents.delete(a);}
  else activeAgents.add(a);
  document.querySelectorAll('.agent-btn').forEach(b=>{
    b.classList.toggle('active',activeAgents.has(b.dataset.agent));
  });
  renderChart();
}

function render(animate){
  const now=new Date();
  document.getElementById('dateline').textContent=now.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric',year:'numeric'});
  const wkRange=getWeekRange(weekOffset);
  document.getElementById('week-label').textContent=wkRange.label;
  document.getElementById('week-nav').style.display=view==='weekly'?'flex':'none';
  const rows=view==='weekly'?filterByWeek(weekOffset):filterByMonth(now);
  const suffix=view==='weekly'?(weekOffset===0?'this week':wkRange.label):now.toLocaleDateString('en-US',{month:'long',year:'numeric'});
  document.getElementById('lb-title').textContent='Leaderboard — '+suffix;
  document.getElementById('pipeline-title').textContent='Pipeline funnel — '+suffix;
  document.getElementById('breakdown-title').textContent='Agent breakdown — '+suffix;
  document.getElementById('chart-title').textContent='Quarterly breakdown — '+now.getFullYear();
  renderLeaderboard(rows);
  renderPipeline(rows);
  renderBars(rows,animate);
  document.querySelectorAll('.q-tab').forEach((b,i)=>b.classList.toggle('active',i+1===activeQuarter));
  renderChart();
}

function setView(v){
  view=v;weekOffset=0;
  document.querySelectorAll('.tab').forEach((b,i)=>b.classList.toggle('active',(i===0&&v==='weekly')||(i===1&&v==='monthly')));
  render(false);
}
function shiftWeek(d){weekOffset+=d;render(false);}

fetchSheet();
setInterval(fetchSheet,120000);
</script>
</body>
</html>
